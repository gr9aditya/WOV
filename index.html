<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brunos Code-Abenteuer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐻</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" role="img" aria-label="Spielfläche"></canvas>
  <div id="labelLayer" aria-hidden="true"><div id="sceneLabels"></div><div id="wipeLabels"></div></div>
  <button id="codeblattBtn" class="hidden" data-i18n="top.codeblatt">Codeblatt öffnen</button>
  <div id="topbar" role="toolbar">
    <button id="muteBtn" data-i18n-title="top.sound.title">Ton AN</button>
    <button id="shakeBtn" data-i18n-title="top.fx.title">FX AN</button>
    <button id="musicBtn" data-i18n-title="top.music.title">Musik AN</button>
    <button id="learnBtn" data-i18n-title="top.learn.title">Lernkarten AN</button>
    <button id="menuBtn" data-i18n="top.menu" data-i18n-title="top.menu.title">Menü</button>
  </div>
  <div id="progress" class="hidden" role="img" aria-label=""><span class="plabel"></span><span class="pbar" aria-hidden="true"></span></div>
  <div id="ctrlHint" class="hidden" aria-hidden="true"></div>
  <div id="hotspotPrompt" class="hidden" role="button" tabindex="0"></div>
  <div id="uiLayer"></div>
  <div id="modalOverlay" class="hidden"></div>
  <div id="touchbar">
    <button data-touch="KeyA" data-i18n-title="touch.left">◀</button>
    <button data-touch="KeyD" data-i18n-title="touch.right">▶</button>
    <button data-touch="Space" data-i18n-title="touch.jump">⤒</button>
    <button data-touch="KeyE" data-i18n-title="touch.use">E</button>
  </div>
  <div id="startScreen" class="hidden">
    <div id="titleCard" role="dialog" aria-labelledby="titleH1">
      <div class="title-star" aria-hidden="true">★</div>
      <h1 id="titleH1" data-i18n-html="title.h1">BRUNOS<br>CODE-ABENTEUER</h1>
      <p class="subtitle" data-i18n-html="title.sub">Eine Reise durch die Sicherheitsschritte<br>des Schweizer E-Votings</p>
      <div class="langrow" role="group" aria-label="Sprache">
        <button class="btn small" data-lang="de" aria-pressed="true">DE</button>
        <button class="btn small" data-lang="fr" aria-pressed="false">FR</button>
        <button class="btn small" data-lang="it" aria-pressed="false">IT</button>
      </div>
      <button class="btn gold big" id="startBtn" data-i18n="title.start">Abenteuer starten</button>
      <p class="controls-hint" data-i18n="title.hint">A / D laufen · Leertaste springen · E benutzen · Enter weiter · G Codeblatt · Esc Menü</p>
    </div>
  </div>
  <div id="loadingScreen"><span data-i18n="title.loading">Lade Assets</span><span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  <div id="a11yLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</div>
<script src="core.js"></script>
<script src="i18n.js"></script>
<script src="labels.js"></script>
<script src="pixart.js"></script>
<script src="engine.js"></script>
<script src="draw.js"></script>
<script src="scenes.js"></script>
<script src="story.js"></script>
<script src="main.js"></script>
</body>
</html>
